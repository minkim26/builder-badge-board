name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install backend dependencies
        run: npm ci
        working-directory: src

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      - name: Run tests
        run: node --test

      - name: Lint frontend
        run: npm run lint
        working-directory: web

      - name: Build frontend
        run: npm run build
        working-directory: web

      - uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3

      - name: Validate SAM template
        run: sam validate --lint

  # Amplify auto-build on main is off; this job is the only frontend deploy.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Trigger Amplify build if the frontend changed
        env:
          BEFORE: ${{ github.event.before }}
          AMPLIFY_WEBHOOK_URL: ${{ secrets.AMPLIFY_WEBHOOK_URL }}
        run: |
          # web/src/tampermonkeyScript.js bundles tampermonkey/progress-sync.user.js
          # into the admin page. git diff also errors on an unknown "before" (first
          # push, force push), which counts as changed, so a deploy is never skipped.
          if ! git diff --quiet "$BEFORE" "$GITHUB_SHA" -- web tampermonkey/progress-sync.user.js amplify.yml customHttp.yml; then
            : "${AMPLIFY_WEBHOOK_URL:?Set the AMPLIFY_WEBHOOK_URL repository secret}"
            curl --fail --silent --show-error --max-time 30 -X POST -d '{}' \
              -H 'Content-Type: application/json' "${AMPLIFY_WEBHOOK_URL}&operation=startbuild"
          else
            echo "No frontend changes in ${BEFORE}..${GITHUB_SHA}, skipping the Amplify build."
          fi
